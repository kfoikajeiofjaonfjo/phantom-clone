name: build-ipa
on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild -project PhantomClone.xcodeproj \
            -scheme PhantomClone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/PhantomClone.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/PhantomClone.xcarchive/Products/Applications/PhantomClone.app build/Payload/
          cd build && zip -qr PhantomClone-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PhantomClone-ipa
          path: build/PhantomClone-unsigned.ipa
