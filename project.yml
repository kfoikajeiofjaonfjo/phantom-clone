name: PhantomClone
options:
  bundleIdPrefix: com.you
  deploymentTarget:
    iOS: "17.0"
targets:
  PhantomClone:
    type: application
    platform: iOS
    sources: [PhantomClone]
    info:
      path: PhantomClone/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Phantom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.you.phantomclone
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
